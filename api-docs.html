<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightinator API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui.css">
  <style>
    html, body { margin: 0; width: 100%; }
    .swagger-ui .info .title { overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      .swagger-ui .wrapper { padding: 0 12px; }
      .swagger-ui .info .title { font-size: 28px; }
      .swagger-ui .opblock .opblock-summary { flex-wrap: wrap; }
      .swagger-ui .opblock-summary-control { min-width: 0; flex-wrap: wrap; }
      .swagger-ui .opblock .opblock-summary-description { flex-basis: 100%; padding: 8px 0; }
      .swagger-ui .opblock .opblock-summary-path { max-width: 100%; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.31.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: window.location.pathname.startsWith('/api/') ? '/api/openapi.json' : './openapi.generated.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        validatorUrl: null,
        persistAuthorization: false
      });
    };
  </script>
</body>
</html>
