name: Workflow Validation

on:
  pull_request:
  push:
    paths:
      - '.github/**'
      - '**/*.cfgdb'
      - 'tools/generate-api-schemas.mjs'
      - 'component.mk'
      - 'api*.json'
      - 'api-docs.html'
      - 'openapi*.json*'
      - 'schema/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install -r .github/requirements-validation.txt

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint every workflow
        run: '"$(go env GOPATH)/bin/actionlint" -color -shellcheck= .github/workflows/*.yml'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test workflow syntax and policies
        run: python -m unittest discover -s .github/tests -v

      - name: Test M3 hardware schema and light ownership
        run: |
          node tools/generate-api-schemas.mjs
          node --test .github/tests/test_hardware_schema.mjs .github/tests/test_virtual_light.mjs .github/tests/test_ledctrl.mjs

      - name: Validate generated OpenAPI documentation
        run: |
          node tools/generate-api-schemas.mjs
          node --test .github/tests/test_openapi.mjs
          npx --yes @redocly/cli@2.12.0 lint openapi.generated.json --extends=minimal
          if ! git diff --exit-code -- api-version.json schema/app-config.schema.json schema/app-data.schema.json json-rpc-api.schema.json openapi.generated.json openapi.generated.json.gz; then
            echo "::error::Generated API schemas are stale. Run node tools/generate-api-schemas.mjs and commit all generated outputs with the schema changes."
            exit 1
          fi

      - name: Upload API documentation
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          if-no-files-found: error
          path: |
            api-docs.html
            openapi.generated.json
            openapi.generated.json.gz
            api-version.json
