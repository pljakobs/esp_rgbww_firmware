name: Publish_Firmware

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows: ["firmwareBuild"]
    types: [completed]
    branches:
      - '5.0/**'
      - '5.1/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: '5.0/develop'
        type: choice
        options:
          - 5.0/develop
          - 5.0/testing
          - 5.0/prod
          - 5.1/develop
          - 5.1/testing
          - 5.1/prod

jobs:
  get-version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      fw_version: ${{ steps.version.outputs.fw_version }}
      fw_branch: ${{ steps.version.outputs.fw_branch }}
      fw_comment_b64: ${{ steps.version.outputs.fw_comment_b64 }}
      latest_run_id: ${{ steps.get_run.outputs.latest_run_id }}  
      supported_socs: ${{ steps.version.outputs.supported_socs }}
      artifact_branch: ${{ steps.get_branch.outputs.artifact_branch }}
      
    steps:
      - name: Checkout release metadata helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.branch }}
          persist-credentials: false

      - name: Disable Jekyll processing
        run: touch .nojekyll

      - name: Get Branch and Artifact Branch
        id: get_branch
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_INPUT_BRANCH: ${{ inputs.branch }}
          CI_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$CI_EVENT_NAME" == "workflow_dispatch" ]]; then
            source_ref="$CI_INPUT_BRANCH"
          else
            source_ref="$CI_RUN_BRANCH"
          fi
          python3 .github/scripts/release_metadata.py resolve "$source_ref" >> "$GITHUB_OUTPUT"

      - name: Get Latest Successful Workflow Run
        id: get_run
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_INPUT_BRANCH: ${{ inputs.branch }}
          CI_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$CI_EVENT_NAME" == "workflow_dispatch" ]]; then
            encoded_branch=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$CI_INPUT_BRANCH")
            latest_run_id=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/pljakobs/esp_rgbww_firmware/actions/workflows/build_firmware.yml/runs?branch=${encoded_branch}&status=success&event=push&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
            
            if [ -z "$latest_run_id" ] || [ "$latest_run_id" == "null" ]; then
              echo "ERROR: No successful workflow runs found"
              exit 1
            fi
          else
            latest_run_id="$CI_WORKFLOW_RUN_ID"
          fi
          
          echo "Latest successful run ID: $latest_run_id"
          echo "latest_run_id=$latest_run_id" >> $GITHUB_OUTPUT
          echo "latest_run_id=$latest_run_id" >> $GITHUB_ENV
          
      - name: Download version info
        uses: actions/download-artifact@v8
        with:
          name: version-info-${{ steps.get_branch.outputs.artifact_branch }}
          path: ./version-info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pljakobs/esp_rgbww_firmware
          run-id: ${{ env.latest_run_id }}
          
      - name: Load version info
        id: version
        run: |
          source ./version-info/version-info.txt
          echo "fw_version=$fw_version" >> $GITHUB_OUTPUT
          echo "fw_branch=$fw_branch" >> $GITHUB_OUTPUT
          echo "fw_comment_b64=${fw_comment_b64:-}" >> $GITHUB_OUTPUT
          test -n "${supported_socs:-}"
          echo "supported_socs=$supported_socs" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: get-version
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    env:
      DISTRIBUTION_PUBLISHER_SHA: ${{ vars.DISTRIBUTION_PUBLISHER_SHA }}
    
    steps:
      # Setup branch variables once at the beginning
      - name: Setup branch variables
        run: |
          source_branch="${{ needs.get-version.outputs.artifact_branch }}"
          target_branch="${{ needs.get-version.outputs.fw_branch }}"
          
          echo "Artifact key: $source_branch"
          echo "Canonical release ref: $target_branch"
          echo "Version: ${{ needs.get-version.outputs.fw_version }}"
          
          # Export to environment variables for later steps
          echo "source_branch=$source_branch" >> $GITHUB_ENV
          echo "target_branch=$target_branch" >> $GITHUB_ENV
          echo "version=${{ needs.get-version.outputs.fw_version }}" >> $GITHUB_ENV
          echo "version_comment_b64=${{ needs.get-version.outputs.fw_comment_b64 }}" >> $GITHUB_ENV
          echo "supported_socs=${{ needs.get-version.outputs.supported_socs }}" >> $GITHUB_ENV
          echo "deploy_run_key=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV
   
      - name: Validate publisher pin
        run: |
          [[ "$DISTRIBUTION_PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Set DISTRIBUTION_PUBLISHER_SHA to a reviewed distribution-server commit SHA"
            exit 1
          }

      - name: Checkout pinned distribution publisher
        uses: actions/checkout@v6
        with:
          repository: pljakobs/lightinator_server
          ref: ${{ env.DISTRIBUTION_PUBLISHER_SHA }}
          path: distribution_publisher
          persist-credentials: false

      - name: Test pinned distribution publisher
        run: |
          set -euo pipefail
          test "$(git -C distribution_publisher rev-parse HEAD)" = "$DISTRIBUTION_PUBLISHER_SHA"
          test "$(python3 distribution_publisher/manage_version.py --publisher-contract)" = "lightinator-sqlite-v1"
          python3 -m venv "$RUNNER_TEMP/publisher-venv"
          "$RUNNER_TEMP/publisher-venv/bin/pip" install -r distribution_publisher/requirements-test.txt
          cd distribution_publisher
          "$RUNNER_TEMP/publisher-venv/bin/python" -m unittest discover -s tests -v
              
      - name: Create directories
        run: |
          IFS=',' read -ra soc_list <<< "${{ env.supported_socs }}"
          for soc in "${soc_list[@]}"; do
            soc=$(echo "$soc" | tr -d ' ')
            mkdir -p download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/debug
            mkdir -p download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/release
            mkdir -p download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/debug/single_image
            mkdir -p download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/release/single_image
          done
          
          # Create version.txt file instead of symlink
          mkdir -p download/firmware/${{ env.target_branch }}/latest
          echo "${{ env.version }}" > download/firmware/${{ env.target_branch }}/latest/version.txt
          echo "<html><head><meta http-equiv=\"refresh\" content=\"0; URL=../${{ env.version }}/\"></head></html>" > download/firmware/${{ env.target_branch }}/latest/index.html
          
      # Download artifacts for the current branch
      - name: Download artifacts
        run: |
          # Build combinations dynamically from supported_socs
          IFS=',' read -ra soc_list <<< "${{ env.supported_socs }}"
          combinations=()
          for soc in "${soc_list[@]}"; do
            soc=$(echo "$soc" | tr -d ' ')
            for build_type in debug release; do
              for single_img in 0 1; do
                if [ "$single_img" = "1" ]; then
                  path="download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/$build_type/single_image"
                else
                  path="download/firmware/${{ env.target_branch }}/${{ env.version }}/$soc/$build_type"
                fi
                combinations+=("$soc $build_type $single_img $path")
              done
            done
          done
          
          for combo in "${combinations[@]}"; do
            read -r soc build_type single_img path <<< "$combo"
            
            # Use source_branch for artifact names but target_branch for deployment paths
            if [ "$single_img" = "1" ]; then
              tag="-single_image"
            else
              tag=""
            fi
            
            if [ "$build_type" = "release" ]; then
              artifact_name="lightinator-${soc}-release${tag}-${{ env.source_branch }}"
            else
              artifact_name="lightinator-${soc}-debug${tag}-${{ env.source_branch }}"
            fi
            
            echo "Downloading $artifact_name to $path"
            
            # Create directory and download
            mkdir -p "$path"
            
            # Download the artifact - continue on errors
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -o /tmp/artifact_list.json \
              "https://api.github.com/repos/pljakobs/esp_rgbww_firmware/actions/runs/${{ needs.get-version.outputs.latest_run_id }}/artifacts"
            
            artifact_url=$(cat /tmp/artifact_list.json | jq -r ".artifacts[] | select(.name == \"$artifact_name\") | .archive_download_url")
            
            if [ -n "$artifact_url" ]; then
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -o "$path/artifact.zip" "$artifact_url"
              
              # Extract the artifact if download was successful
              if [ -f "$path/artifact.zip" ]; then
                unzip -q -o "$path/artifact.zip" -d "$path"
                rm "$path/artifact.zip"
              else
                echo "Failed to download $artifact_name"
              fi
            else
              echo "No artifact named $artifact_name found"
            fi
          done
      
      # Download version.json from lightinator.de into staging if it exists, to ensure we have a base
      # But actually, we will be updating the one ON the server, so we don't strictly need to download it 
      # unless we want to validate something locally.
      # The previous steps "Get version.json" and "Update version.json" are now redundant 
      # because we moved the logic to the remote server in the "Deploy" step.
      
      # Setup and deploy to your external server
      - name: Setup SSH and deploy
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          
      - name: Configure variables
        run: |
          echo "deploy_user=github-deploy" >> $GITHUB_ENV
          echo "deploy_server=lightinator.de" >> $GITHUB_ENV
          echo "deploy_path=/home/github-deploy/nginx/html" >> $GITHUB_ENV

      - name: Port knock
        run: |
          if [ -n "${{ secrets.DEPLOY_KNOCK_URL }}" ]; then
            echo "Performing port knock..."
            curl -s "${{ secrets.DEPLOY_KNOCK_URL }}" || echo "Knock failed, continuing anyway..."
            sleep 2
          else
            echo "No knock URL configured, skipping..."
          fi
          
      - name: Add server to known_hosts
        run: |
          ssh-keyscan ${{ env.deploy_server }} >> ~/.ssh/known_hosts
          
      - name: Deploy to External Server (rsync)
        run: |
          # 1. Prepare Staging Area
          mkdir -p staging
          
          # Move download directory to staging
          mv download staging/
          PUBLISHER_DIR="publisher-firmware-${{ env.deploy_run_key }}"
          mkdir -p "staging/$PUBLISHER_DIR"
          cp distribution_publisher/manage_version.py "staging/$PUBLISHER_DIR/manage_version-${{ env.deploy_run_key }}.py"
          cp distribution_publisher/version_api.py distribution_publisher/migrate_to_sqlite.py "staging/$PUBLISHER_DIR/"
          cp -r distribution_publisher/images "staging/$PUBLISHER_DIR/"
          printf '%s\n' "$DISTRIBUTION_PUBLISHER_SHA" > "staging/$PUBLISHER_DIR/SOURCE_REVISION"
          
          # Use run-specific names so concurrent publishes cannot overwrite
          # files before they acquire the remote deployment lock.
          
          # Create the remote script that will orchestrate the update on the server
          # This script handles:
          # 1. Updating version.json with the new files (using the uploaded manage_version.py)
          # 2. Culling old versions
          # 3. Setting permissions
          cat > "staging/remote_update-${{ env.deploy_run_key }}.sh" << 'EOF'
          #!/bin/bash
          set -e
          
          # Variables passed from the workflow env
          DEPLOY_PATH="${{ env.deploy_path }}"
          TARGET_BRANCH="${{ env.target_branch }}"
          VERSION="${{ env.version }}"
          COMMENT_B64="${{ env.version_comment_b64 }}"
          DEPLOY_SERVER="${{ env.deploy_server }}"
          SUPPORTED_SOCS="${{ env.supported_socs }}"
          PUBLISHER_DIR="publisher-firmware-${{ env.deploy_run_key }}"
          MANAGE_SCRIPT="$PUBLISHER_DIR/manage_version-${{ env.deploy_run_key }}.py"
          MANAGE_PYTHON="/home/github-deploy/lightinator-server/.venv/bin/python"
          export VERSION_DB_PATH="${VERSION_DB_PATH:-/home/github-deploy/lightinator-server/firmware.db}"
          REMOTE_SCRIPT="remote_update-${{ env.deploy_run_key }}.sh"
          
          cd "$DEPLOY_PATH"
          export VERSION_ASSET_ROOT="$DEPLOY_PATH"
          test -f "$MANAGE_SCRIPT" && test -x "$MANAGE_PYTHON"
          test "$(cat "$PUBLISHER_DIR/SOURCE_REVISION")" = "${{ env.DISTRIBUTION_PUBLISHER_SHA }}"
          test "$("$MANAGE_PYTHON" "$MANAGE_SCRIPT" --publisher-contract)" = "lightinator-sqlite-v1"

          # Ensure new firmware path layout exists
          mkdir -p "download/firmware/$TARGET_BRANCH/$VERSION"
          mkdir -p "download/firmware/$TARGET_BRANCH/latest"
          
          echo "Publishing firmware to SQLite on remote..."
          
          # Update version.json for each uploaded artifact
          IFS=',' read -ra soc_list <<< "$SUPPORTED_SOCS"
          for soc in "${soc_list[@]}"; do
            soc=$(echo "$soc" | tr -d ' ')
            for type in debug release; do
              if [ "$soc" = "esp8266" ]; then
                bin_file="rom0.bin"
                elf_file="app_0.out"
                map_file="app_0.map"
              else
                bin_file="app.bin"
                elf_file="app.out"
                map_file="app.map"
              fi
              
              url="http://$DEPLOY_SERVER/download/firmware/$TARGET_BRANCH/$VERSION/$soc/$type/$bin_file"
              "$MANAGE_PYTHON" "$MANAGE_SCRIPT" version.json add "$soc" "$type" "$TARGET_BRANCH" "$VERSION" "$url" --comment-b64 "$COMMENT_B64"
              
              # ELF and map are sibling files — URL predictable by replacing bin filename.
              echo "ELF deployed at: http://$DEPLOY_SERVER/download/firmware/$TARGET_BRANCH/$VERSION/$soc/$type/$elf_file"
              echo "MAP deployed at: http://$DEPLOY_SERVER/download/firmware/$TARGET_BRANCH/$VERSION/$soc/$type/$map_file"
            done
          done
          
          # Update 'latest' pointer
          mkdir -p download/firmware/$TARGET_BRANCH/latest
          # We need to make sure the target directory structure exists before writing to it
          # validation: check if the latest version directory actually exists
          if [ -d "download/firmware/$TARGET_BRANCH/$VERSION" ]; then
              echo "$VERSION" > download/firmware/$TARGET_BRANCH/latest/version.txt
              echo "<html><head><meta http-equiv=\"refresh\" content=\"0; URL=../$VERSION/\"></head></html>" > download/firmware/$TARGET_BRANCH/latest/index.html
          else
              echo "Warning: Version directory download/firmware/$TARGET_BRANCH/$VERSION does not exist on remote"
          fi

          # Create/update direct download symlinks: download/firmware/<soc>/<branch>/<type>/app-merged.bin
          # These match the static HTML download links and always point to the latest version.
          echo "Updating direct download symlinks..."
          IFS=',' read -ra soc_list <<< "$SUPPORTED_SOCS"
          for soc in "${soc_list[@]}"; do
            soc=$(echo "$soc" | tr -d ' ')
            for type in debug release; do
              symlink_dir="download/firmware/$soc/$TARGET_BRANCH/$type"
              mkdir -p "$symlink_dir"
              # Relative path from download/firmware/<soc>/<branch>/<type>/ up to download/firmware/ then into versioned path
              ln -sf "../../../../firmware/$TARGET_BRANCH/$VERSION/$soc/$type/single_image/app-merged.bin" \
                "$symlink_dir/app-merged.bin"
              echo "Symlink: $symlink_dir/app-merged.bin -> ../../../../firmware/$TARGET_BRANCH/$VERSION/$soc/$type/single_image/app-merged.bin"
            done
          done

          echo "Culling old versions..."
          "$MANAGE_PYTHON" "$MANAGE_SCRIPT" version.json cull
          
          echo "Fixing permissions..."
          # Set ownership to deploy user:nginx group
          chown -R github-deploy:nginx *
          # Ensure directories are 755 and files are 644
          find download/firmware -type d -exec chmod 755 {} \;
          find download -type f -exec chmod 644 {} \;
          rm -r -- "$PUBLISHER_DIR"
          rm "$REMOTE_SCRIPT"
          EOF
          
          chmod +x "staging/remote_update-${{ env.deploy_run_key }}.sh"
          
          # 2. Deploy using rsync
          # -r: recursive
          # -l: copy symlinks as symlinks
          # -v: verbose
          # -z: compress
          # --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r: set destination permissions specifically for new files
          # We avoid -a (archive) because it includes -p (perms), -t (times), -o (owner), -g (group)
          # which can cause "code 23" errors if the remote user doesn't own the destination files.
          
          echo "Syncing files..."
          rsync -rlvz --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r -e "ssh -o StrictHostKeyChecking=no" staging/ ${{ env.deploy_user }}@${{ env.deploy_server }}:${{ env.deploy_path }}/
          
          # 3. Execute the update logic on the remote server
          echo "Running remote update script..."
          ssh -o StrictHostKeyChecking=no ${{ env.deploy_user }}@${{ env.deploy_server }} \
            "flock /tmp/lightinator-firmware-deploy.lock bash ${{ env.deploy_path }}/remote_update-${{ env.deploy_run_key }}.sh"

