name: Swarm Test

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [stable, testing, develop, experimental]
  pull_request:
    branches: [stable, testing, develop, experimental]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'develop'
        type: choice
        options:
          - stable
          - testing
          - develop
          - experimental

jobs:
  # Multi-controller mDNS discovery swarm on the self-hosted runner.
  # SECURITY: never runs on pull_request events — a self-hosted runner must not
  # execute untrusted code submitted via a PR. Only push / workflow_dispatch.
  swarm-mdns:
    # No dependency on host-smoke: the swarm builds its own Host binary, so it
    # can start immediately and run in parallel with the smoke job.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Ensure host TUN/TAP support
        if: always()
        run: |
          # The swarm builds TAP interfaces inside the privileged container, which
          # needs the host kernel's tun driver loaded and a /dev/net/tun node.
          sudo modprobe tun 2>/dev/null || true
          if [ ! -c /dev/net/tun ]; then
            sudo mkdir -p /dev/net 2>/dev/null || true
            sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
            sudo chmod 0666 /dev/net/tun 2>/dev/null || true
          fi
          ls -l /dev/net/tun 2>&1 || echo "::warning::/dev/net/tun still unavailable on host; container will attempt to create it."

      - name: Pull Docker Image
        run: docker pull docker.io/pjakobs/sming:latest

      - name: Run multi-controller mDNS discovery swarm
        if: always()
        continue-on-error: true
        env:
          GITHUB_ACTIONS: 'true'
          SWARM_SIZE: '50'
        run: |
          set -uo pipefail
          mkdir -p out/host-swarm
          echo "Starting mDNS discovery swarm at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Heartbeat so the job never looks stalled during convergence polling.
          (
            while true; do
              sleep 20
              echo "[swarm][heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            done
          ) &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true' EXIT

          # Build the Host binary fresh on this runner and launch the swarm.
          # Building here (instead of reusing the smoke artifact) decouples this
          # job from host-smoke so both run in parallel. Just do a normal Host
          # build+flash (default sanitizers, which link fine in the image), then
          # run the swarm against that prebuilt binary (SWARM_SKIP_BUILD=1).
          docker run --rm --privileged --device /dev/net/tun -v ${{ github.workspace }}:/workspace -w /workspace \
            -e GITHUB_ACTIONS=${{ env.GITHUB_ACTIONS }} \
            -e SWARM_SIZE=${{ env.SWARM_SIZE }} \
            -e SWARM_SKIP_BUILD=1 \
            docker.io/pjakobs/sming:latest \
            bash -lc "git config --global --add safe.directory /workspace && { source /opt/Sming/Tools/export.sh || source /opt/sming/Tools/export.sh; } && make SMING_ARCH=Host flash DISABLE_WERROR=1 COM_SPEED=115200 && bash ./testswarm-local.sh none" \
            2>&1 | tee out/host-swarm/swarm-discovery.log || true

          echo "mDNS discovery swarm step completed (soft; non-blocking)."

      - name: Upload swarm logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swarm-mdns-${{ github.run_number }}
          path: |
            out/host-swarm/**
          if-no-files-found: warn
          retention-days: 30

      - name: Create swarm job summary
        if: always()
        run: |
          echo "## 🛰️ Multi-controller mDNS Discovery Swarm (soft)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nodes: ${SWARM_SIZE:-50}" >> "$GITHUB_STEP_SUMMARY"
          SWARM_SUMMARY="out/host-swarm/summary.txt"
          if [[ -f "$SWARM_SUMMARY" ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$SWARM_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ Swarm summary not found ($SWARM_SUMMARY) — see swarm-discovery.log" >> "$GITHUB_STEP_SUMMARY"
          fi